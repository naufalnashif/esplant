<!doctype html>
<html lang="id">
  <head><meta charset="utf-8"><title>Form submissions</title></head>
  <body>
    <form name="product-feedback" method="POST" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="product-feedback">
      <input name="category">
      <textarea name="message"></textarea>
      <textarea name="developer_question"></textarea>
      <input name="screenshot" type="file">
      <input name="rating">
      <input name="name">
      <input name="email" type="email">
      <input name="bot-field">
    </form>
  </body>
</html>
