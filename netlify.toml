# Esplant — Netlify deployment configuration
# Frontend (Vite static build) + serverless Functions for Gmail OAuth & Resend reports.
# All personal financial data stays in the user's browser (IndexedDB); Functions only
# proxy OAuth token exchange and email delivery so secrets never reach the client.

[build]
  command = "cd frontend && yarn install && yarn build"
  publish = "frontend/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback — function routes (declared via `config.path` in each function) are
# matched BEFORE this redirect, so /api/integrations/* keeps working.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
