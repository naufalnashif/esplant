# _self.manage — Netlify deployment configuration
# Static Vite build outputted to frontend/dist

[build]
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/dist"

# Static files (privacy.html, terms.html, favicon) are served before this rewrite.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/privacy.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/terms.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
